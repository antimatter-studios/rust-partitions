name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        run: cargo test --locked --all-targets
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # The debug profile turns integer overflow into a panic; the release
  # profile, which is what ships, lets it wrap. A guard against a
  # wrapping computation therefore passes in `cargo test` for the wrong
  # reason — the panic — while the behaviour it guards against is still
  # live in the built library. Running the suite once in release is what
  # makes those tests mean anything.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: test --release
        run: cargo test --locked --release --all-targets

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check
