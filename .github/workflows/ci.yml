name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        # `shell: bash` IS LOAD BEARING ON THE WINDOWS LEG. The default
        # shell there is pwsh, which has no `trap ... EXIT` and no
        # `[ ]`, so the floor below would be a syntax error on a third
        # of this matrix. ubuntu and macOS already default to bash;
        # saying it here keeps all three legs running one script.
        shell: bash
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it
        # is what makes every arithmetic test in this crate mean anything.
        #
        # The variable tells `overflow_checks::the_build_the_gate_asked_to
        # _check_does_check` in src/lib.rs that THIS is the run that must
        # trap an overflow -- asking the build directly rather than
        # inferring it from which spellings of "disabled" happen to be
        # absent from Cargo.toml. It is declared as an `env:` mapping
        # rather than inline as `VAR=1 cargo test` because this job also
        # runs on windows-latest, where that prefix is a PowerShell
        # syntax error.
        #
        # Do not add `--release` to this run, and do not drop the
        # variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting this.
        # See #86.
        run: |
          # The output is captured by REDIRECTION AND REPLAYED BY A
          # TRAP, not by `cargo test | tee`, and the difference is the
          # whole point of the step. Actions runs a `run:` block as bash
          # with `-e`, where a pipeline's status is its LAST member's,
          # so `cargo test ... | tee log` exits 0 with the suite red --
          # the step would report green while the gate this job exists
          # to be was blind. tests/ci_profile.rs refuses that spelling
          # for exactly that reason, and the refusal is correct: a
          # capture that swallows the result is worse than no capture.
          # `set +e` around it is refused for the same reason and would
          # be the same defect. So the suite's status is read by the
          # shell, unmodified, and the log is a file.
          trap 'cat "$RUNNER_TEMP/test.log"' EXIT
          cargo test --locked --all-targets > "$RUNNER_TEMP/test.log" 2>&1
          # A FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE. This
          # job reports green on `0 passed; 0 failed` exactly as loudly
          # as it does on the whole suite: cargo exits 0 when a filter
          # selects nothing, when a target list comes out empty, and
          # when the workspace built no test binaries at all. Nothing in
          # a pass/fail gate can see the difference, because there is no
          # failure to see. Only a count can.
          #
          # Measured 2026-09-18 on the branch for #119: 284 executed,
          # across eight binaries (37, 7, 5, 94, 54, 12, 72, 3) and with
          # `0 filtered out` everywhere. That is 276 (run 35176029936,
          # main, b9a9d82) plus the eight regression tests the external
          # -tool oracle's findings brought with them -- restated as
          # ordinary tests so they run on macOS and Windows too, where
          # the oracle cannot. The floor is 258, about 9% below, so
          # ordinary churn in the suite does not trip it while the
          # collapse it is aimed at -- a whole binary, or the whole run,
          # going missing -- does. It moves up with the suite and never
          # down.
          #
          # The `oracle (external tools)` job's own tests are NOT in
          # this number: their target carries `required-features =
          # ["oracle"]`, so `--all-targets` here does not build it. That
          # job counts its own.
          #
          # ONE FLOOR IS ENOUGH HERE ONLY BECAUSE THIS JOB MAKES ONE
          # SELECTION. There is no `-- --ignored` pass and no `#[ignore]`
          # in the crate, so every test the job can run is in this
          # number. Add a second `cargo test` selecting differently and
          # it needs its own floor: two disjoint selections can empty
          # independently, and a shared total hides the one that did.
          #
          # One `awk` rather than `grep | awk`: the runner's bash has
          # `pipefail`, so on the one input that matters most -- a log
          # with no `test result:` line in it -- grep exits 1, the
          # assignment fails, `-e` abandons the step, and the floor
          # never gets to say what happened. `match`/`RSTART` is POSIX
          # and behaves the same on the macOS and Windows runners.
          n=$(awk 'match($0, /test result: ok\. [0-9]+ passed/) { hit = substr($0, RSTART, RLENGTH); split(hit, f, " "); s += f[4] } END { print s+0 }' "$RUNNER_TEMP/test.log")
          echo "tests executed: $n (floor 258)"
          if [ "$n" -lt 258 ]; then
              echo "::error::only $n tests executed, floor is 258 -- 284 ran on 2026-09-18, and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # The debug profile turns integer overflow into a panic; the release
  # profile, which is what ships, lets it wrap. A guard against a
  # wrapping computation therefore passes in `cargo test` for the wrong
  # reason — the panic — while the behaviour it guards against is still
  # live in the built library. Running the suite once in release is what
  # makes those tests mean anything.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: test --release
        run: |
          # Captured by redirection and replayed by a trap rather than
          # piped into `tee`, for the reason spelled out in the debug
          # job above: under `bash -e` a pipeline's status is its last
          # member's, and a capture that swallows the suite's result
          # turns this job green on a red suite.
          trap 'cat "$RUNNER_TEMP/test.log"' EXIT
          cargo test --locked --release --all-targets > "$RUNNER_TEMP/test.log" 2>&1
          # The same floor, and this job has its own because it is its
          # own selection: the release build produces its own test
          # binaries, and a release run that collapsed to nothing while
          # the debug legs stayed whole would be invisible to a count
          # taken in the other job.
          #
          # Measured 2026-09-18 on the branch for #119: 284 executed --
          # the same count as the debug legs, which is what makes this a
          # real second pass over the suite rather than a subset of it.
          # Floor 258, about 9% below. It moves up with the suite and
          # never down.
          n=$(awk 'match($0, /test result: ok\. [0-9]+ passed/) { hit = substr($0, RSTART, RLENGTH); split(hit, f, " "); s += f[4] } END { print s+0 }' "$RUNNER_TEMP/test.log")
          echo "tests executed: $n (floor 258)"
          if [ "$n" -lt 258 ]; then
              echo "::error::only $n tests executed, floor is 258 -- 284 ran on 2026-09-18, and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi

  # THE ONLY CHECK IN THIS REPOSITORY THAT IS NOT THIS CRATE MARKING ITS
  # OWN HOMEWORK.
  #
  # `tests/oracle_tools.rs` builds tables with this crate and requires
  # sgdisk, sfdisk, blkid and partx to report them field by field, then
  # has sgdisk and sfdisk build tables and requires this crate to read
  # the same values back. Everything else in `tests/` is the writer
  # against the reader, which cannot see the failure this crate is most
  # exposed to: agreeing with itself and disagreeing with the world. See
  # #119.
  #
  # IT IS ITS OWN JOB BECAUSE THE TARGET IS BEHIND A FEATURE. The oracle
  # refuses to skip when a tool is missing, and `test / macos-latest`
  # and `test / windows-latest` have none of these tools -- so the
  # target carries `required-features = ["oracle"]` in Cargo.toml and is
  # not in `--all-targets` anywhere else. This job is the one place the
  # feature is on, and it installs the tools first.
  oracle:
    name: oracle (external tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.10 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `util-linux` (sfdisk, blkid, partx) is already on the runner;
      # installing it anyway is what makes this step the declaration of
      # what the suite needs rather than a bet on the image's contents.
      # `gdisk` (sgdisk) is not there by default.
      - name: install the reference partitioning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdisk util-linux
          sgdisk --version
          sfdisk --version
      - name: test the oracle
        shell: bash
        run: |
          # A VERDICT, NOT A TRANSCRIPT. The whole log is kept in a file
          # and only the tail of it is printed, and only when something
          # failed; a green run prints the ten summary lines the suite
          # itself emits and one total. The reason is the one written up
          # in fs-linux-test-harness's scripts/output-budget.sh: a
          # passing run that prints hundreds of lines hides the handful
          # that matter, and every reader pays for it -- a person
          # scrolling, the log viewer, and an agent working here, which
          # re-reads its transcript on every step. The oracle makes ~780
          # field comparisons; a line each would be exactly the failure
          # mode that document is about. The detail lives in the
          # assertion message, which names the image, the partition, the
          # field, our value and the tool's.
          #
          # Redirected and replayed by a trap, not piped into `tee`, for
          # the reason spelled out on the `test` job above: under
          # `bash -e` a pipeline's status is its last member's, and a
          # capture that swallows the suite's result turns this job
          # green on a red suite. The trap re-raises the status it
          # caught so that stays true.
          trap 'rc=$?; [ "$rc" -eq 0 ] || { echo "--- last 60 lines of $RUNNER_TEMP/oracle.log ---"; tail -n 60 "$RUNNER_TEMP/oracle.log"; }; exit "$rc"' EXIT
          # `--nocapture` is what lets the per-test summary lines out;
          # `--quiet` drops cargo's per-test name lines, so the visible
          # output of a green run is ten counts and a result line.
          cargo test --locked --quiet --features oracle --test oracle_tools -- --nocapture > "$RUNNER_TEMP/oracle.log" 2>&1
          grep -E 'comparisons \(floor|test result:' "$RUNNER_TEMP/oracle.log" || true
          # TWO FLOORS, AND THIS JOB NEEDS THEM MOST OF ALL. Its whole
          # subject is a comparison that can quietly stop happening: a
          # tool whose output format moved, a target that stopped being
          # built, a feature that stopped being passed. Every one of
          # those ends in `0 passed; 0 failed`, which cargo exits 0 on.
          #
          # The first floor is on tests executed. Measured 2026-09-18 on
          # this branch: 9 executed. The floor is 9 rather than a
          # percentage below it, because there are nine tests and each
          # is a whole direction or a whole table format -- losing any
          # one is not churn.
          n=$(awk 'match($0, /test result: ok\. [0-9]+ passed/) { hit = substr($0, RSTART, RLENGTH); split(hit, f, " "); s += f[4] } END { print s+0 }' "$RUNNER_TEMP/oracle.log")
          if [ "$n" -lt 9 ]; then
              echo "::error::only $n oracle tests executed, floor is 9 -- 9 ran on 2026-09-18, and a run that executes fewer than that compared this crate against fewer readers than it was asked to"
              exit 1
          fi
          # The second is on FIELD comparisons, summed from the counts
          # each test prints. Each test already asserts its own floor
          # (`Comparisons::floor`), so this total cannot silently fall;
          # it is here because it is the number that says what the job
          # did, and because it turns the ten separate floors into one
          # line a reader can check. Measured 2026-09-18: 775.
          # Floor 700, about 10% below.
          f=$(awk 'match($0, /: [0-9]+ comparisons \(floor/) { hit = substr($0, RSTART, RLENGTH); split(hit, g, " "); s += g[2] } END { print s+0 }' "$RUNNER_TEMP/oracle.log")
          echo "oracle: $n tests, $f field comparisons against sgdisk/sfdisk/blkid/partx (floors 9, 700)"
          if [ "$f" -lt 700 ]; then
              echo "::error::only $f field comparisons ran, floor is 700 -- 775 ran on 2026-09-18, and a run that compares fewer has stopped finding fields rather than stopped disagreeing"
              exit 1
          fi
      # `--all-targets` in the `test` job does not build the oracle
      # target, because its feature is off there. This is the only job
      # that can lint it.
      - name: clippy
        run: cargo clippy --locked --features oracle --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#124). Branch protection used to name six
    # contexts by hand -- `fmt`, `test (release)`, the three
    # `test / <os>` matrix legs and `oracle (external tools)`. Requiring
    # this gate instead means a leg can be added to the matrix, the
    # oracle job renamed, or a job split in two, without leaving a
    # required check that never reports -- which GitHub reads as
    # permanently pending, with enforce_admins on and nothing to point
    # at. It is also the only shape in which a job-level `if:` is safe.
    if: always()
    needs: [test, test-release, oracle, fmt]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
